name: AWS Cloud Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target AWS Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write   # Required for AWS OIDC role assumption
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Role Assumption)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::123456789012:role/GitHubActionsDeploymentRole' }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Plan & Apply (Dev)
        run: |
          cd infrastructure/terraform/environments/dev
          terraform init
          terraform apply -auto-approve

      - name: Smoke Test Dev Gateway
        run: |
          echo "Executing smoke tests against Dev environment..."

  deploy-prod:
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: prod   # Requires manual approval in GitHub repository environment settings
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Role Assumption)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN || 'arn:aws:iam::123456789012:role/GitHubActionsProdDeploymentRole' }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Plan & Apply (Prod)
        run: |
          cd infrastructure/terraform/environments/prod
          terraform init
          terraform apply -auto-approve
