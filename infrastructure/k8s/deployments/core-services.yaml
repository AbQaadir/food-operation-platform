apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: food-operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/food-platform/identity-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: POSTGRES_DB
              value: "identity_db"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: food-operations
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - port: 8081
      targetPort: 8081
---
