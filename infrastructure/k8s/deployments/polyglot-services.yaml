apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: food-operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/food-platform/notification-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: POSTGRES_DB
              value: "notification_db"
            - name: PORT_NOTIFICATION
              value: "8085"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: food-operations
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 8085
      targetPort: 8085
---
