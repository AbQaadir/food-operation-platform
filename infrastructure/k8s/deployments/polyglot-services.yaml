apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: food-operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/food-platform/ai-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: PORT
              value: "8087"
            - name: LLM_PROVIDER
              value: "mock"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8082"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8083"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8084"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: food-operations
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: food-operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/food-platform/frontend:latest
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: food-operations
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
